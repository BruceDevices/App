name: Release BruceApp Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Accept licenses
      run: |
        yes | sdkmanager --licenses || true

    # Chaquopy targets Python 3.8 and only emits .pyc when the build interpreter
    # matches; otherwise the released APK ships .py and the first flash is very slow.
    - name: Set up Python 3.8 for Chaquopy
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        "$HOME/.local/bin/uv" python install --default 3.8.18
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Verify python3 is 3.8
      run: |
        python3 -V
        python3 -V | grep -q '^Python 3\.8\.' || {
          echo "::error::python3 is not 3.8 — Chaquopy would ship .py instead of .pyc"
          exit 1
        }

    - name: Build release APK
      run: |
        ./gradlew clean assembleRelease

    # Unsigned release builds land as app-release-unsigned.apk, so glob instead of
    # hardcoding the name.
    - name: Verify APK exists
      id: verify-apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "ERROR: no APK in app/build/outputs/apk/release"
          find . -name '*.apk' || true
          exit 1
        fi
        echo "APK exists at: $APK_PATH"
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-release
        path: app/build/outputs/apk/release/*.apk

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.verify-apk.outputs.apk_path }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
